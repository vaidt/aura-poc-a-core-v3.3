name: CORE Full Suite — Docker Evidence

on:
  push:
    branches:
      - main
      - validation/core-full-suite-128-docker-2026-10-14

permissions:
  contents: read

jobs:
  full-suite:
    name: Docker-backed full pytest suite (162 expected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Docker daemon and Compose
        run: |
          set -euo pipefail
          docker version
          docker info
          docker compose version

      - name: Pull PostgreSQL/pgvector test image
        run: docker pull pgvector/pgvector:pg16

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.2

      - name: Collect complete pytest suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python -m pytest --collect-only -q 2>&1 | tee artifacts/core-full-suite-collection.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "${result}" -ne 0 ]]; then
            exit "${result}"
          fi
          collected="$(grep -Eo '[0-9]+ tests collected' artifacts/core-full-suite-collection.log | tail -1 | awk '{print $1}')"
          if [[ -z "${collected}" ]]; then
            echo "Could not determine the collected test count." >&2
            tail -n 30 artifacts/core-full-suite-collection.log
            exit 1
          fi
          echo "Full suite collected: ${collected} tests (declared gate target: 162)."
          echo "All collected tests will execute; count mismatch remains a separate gate."

      - name: Run complete suite with Docker-backed integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python -m pytest -v --tb=short 2>&1 | tee artifacts/core-full-suite.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "${result}" -ne 0 ]]; then
            exit "${result}"
          fi

      - name: Enforce declared 162/162 acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          collected="$(grep -Eo '[0-9]+ tests collected' artifacts/core-full-suite-collection.log 2>/dev/null | tail -1 | awk '{print $1}' || true)"
          passed="$(grep -Eo '[0-9]+ passed' artifacts/core-full-suite.log 2>/dev/null | tail -1 | awk '{print $1}' || true)"
          echo "Declared target: 162 collected / 162 passed"
          echo "Observed: collected=${collected:-UNAVAILABLE}, passed=${passed:-UNAVAILABLE}"
          if [[ "${collected:-}" != "162" || "${passed:-}" != "162" ]]; then
            echo "::error::The declared 162/162 gate is not satisfied by the current full test collection."
            exit 1
          fi

      - name: Clean up Docker test containers
        if: always()
        run: |
          docker compose -p aura_cr004_append_only -f docker-compose.yml down -v --remove-orphans || true
          docker compose -p aura_cr003_statelessness -f docker-compose.yml down -v --remove-orphans || true

      - name: Upload raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-full-suite-docker-evidence
          path: |
            artifacts/core-full-suite-collection.log
            artifacts/core-full-suite.log
            artifacts/db-append-only-results.json
            artifacts/cr-003-statelessness-results.json
            artifacts/rd-006-ari-observation.json
          if-no-files-found: warn
          retention-days: 30

  # CORE-003: run the real evaluator on native (not emulated) x86_64 and ARM64 hosts.
  ari-architecture:
    name: CORE-003 ARI/drift on ${{ matrix.expected_machine }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            expected_machine: x86_64
          - runner: ubuntu-24.04-arm
            expected_machine: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute fixed ARI/drift vectors on native architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/ari_architecture_evidence.py record \
            --expected-machine "${{ matrix.expected_machine }}" \
            --runner-label "${{ matrix.runner }}" \
            --revision "${GITHUB_SHA}" \
            --output "artifacts/ari-architecture-${{ matrix.expected_machine }}.json"

      - name: Upload architecture observation
        uses: actions/upload-artifact@v4
        with:
          name: ari-architecture-${{ matrix.expected_machine }}
          path: artifacts/ari-architecture-${{ matrix.expected_machine }}.json
          if-no-files-found: error
          retention-days: 30

  compare-ari-architecture:
    name: CORE-003 compare actual ARI/drift outputs
    needs: ari-architecture
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download native architecture records
        uses: actions/download-artifact@v4
        with:
          pattern: ari-architecture-*
          path: artifacts/architecture-inputs
          merge-multiple: true

      - name: Compare full inputs and real ARI/drift outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ari_architecture_evidence.py compare \
            --x86 artifacts/architecture-inputs/ari-architecture-x86_64.json \
            --arm artifacts/architecture-inputs/ari-architecture-aarch64.json \
            --output artifacts/core-003-cross-architecture-comparison.json

      - name: Upload comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-003-cross-architecture-comparison
          path: artifacts/core-003-cross-architecture-comparison.json
          if-no-files-found: error
          retention-days: 30
