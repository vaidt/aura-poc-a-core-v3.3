name: CORE Full Suite — Docker Evidence

on:
  push:
    branches:
      - validation/core-full-suite-128-docker-2026-10-14

permissions:
  contents: read

jobs:
  full-suite:
    name: Docker-backed full pytest suite (128 expected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Docker daemon and Compose
        run: |
          set -euo pipefail
          docker version
          docker info
          docker compose version

      - name: Pull PostgreSQL/pgvector test image
        run: docker pull pgvector/pgvector:pg16

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.2

      - name: Collect all tests and enforce expected collection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python -m pytest --collect-only -q 2>&1 | tee artifacts/core-full-suite-collection.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "${result}" -ne 0 ]]; then
            exit "${result}"
          fi
          if ! grep -Eq '^128 tests collected([[:space:]]|$)' artifacts/core-full-suite-collection.log; then
            echo "Expected exactly 128 collected tests." >&2
            tail -n 30 artifacts/core-full-suite-collection.log
            exit 1
          fi

      - name: Run complete suite with Docker-backed integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          python -m pytest -v --tb=short 2>&1 | tee artifacts/core-full-suite.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "${result}" -ne 0 ]]; then
            exit "${result}"
          fi
          if ! grep -Eq '^=+[[:space:]]+128 passed([,[:space:]]|$)' artifacts/core-full-suite.log; then
            echo "Expected 128/128 tests to pass." >&2
            tail -n 30 artifacts/core-full-suite.log
            exit 1
          fi

      - name: Clean up Docker test containers
        if: always()
        run: |
          docker compose -p aura_cr004_append_only -f docker-compose.yml down -v --remove-orphans || true
          docker compose -p aura_cr003_statelessness -f docker-compose.yml down -v --remove-orphans || true

      - name: Upload raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-full-suite-docker-evidence
          path: |
            artifacts/core-full-suite-collection.log
            artifacts/core-full-suite.log
            artifacts/db-append-only-results.json
            artifacts/cr-003-statelessness-results.json
            artifacts/rd-006-ari-observation.json
          if-no-files-found: warn
          retention-days: 30
